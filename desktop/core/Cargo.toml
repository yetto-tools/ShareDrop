[package]
name = "sharedrop-core"
version = "0.1.0"
edition = "2021"
description = "Núcleo del protocolo ShareDrop: descubrimiento, emparejamiento, cifrado y transferencia"

[dependencies]
aes-gcm = "0.10"
dirs = "5"
hex = "0.4"
hmac = "0.12"
hostname = "0.4"
if-addrs = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
subtle = "2"
uuid = { version = "1", features = ["v4"] }
