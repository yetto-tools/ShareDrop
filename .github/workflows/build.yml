name: Build

# develop: artefactos de prueba. release: artefactos candidatos. main: artefactos estables.
# Una etiqueta v* publica un GitHub Release con los instaladores.
on:
  push:
    branches: [develop, release, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop-windows:
    name: Instalador Windows (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo install tauri-cli --version "^2" --locked
      - working-directory: desktop/app
        run: cargo tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: sharedrop-windows
          path: desktop/target/release/bundle/nsis/*.exe

  desktop-linux:
    name: Paquetes Linux (deb, rpm, AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo install tauri-cli --version "^2" --locked
      - working-directory: desktop/app
        run: cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: sharedrop-linux
          path: |
            desktop/target/release/bundle/deb/*.deb
            desktop/target/release/bundle/rpm/*.rpm
            desktop/target/release/bundle/appimage/*.AppImage

  cli-linux:
    name: CLI Linux (Rocky 9 y servidores)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - working-directory: desktop
        run: cargo build --release -p sharedrop-cli
      - uses: actions/upload-artifact@v4
        with:
          name: sharedrop-cli-linux
          path: desktop/target/release/sharedrop-cli

  android:
    name: APK Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sharedrop-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

  release:
    name: Publicar GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop-windows, desktop-linux, cli-linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
